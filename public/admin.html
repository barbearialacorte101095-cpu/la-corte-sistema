<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Corte Barber Shop - PDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'chumbo': '#121212',
                        'chumbo-claro': '#1E1E1E',
                        'verde-corte': '#1F4529',
                        'prata': '#B0B0B0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-chumbo text-white min-h-screen p-8 font-sans">

    <!-- Cabeçalho Principal -->
    <header class="flex justify-between items-center border-b border-verde-corte pb-6 mb-6">
        <div>
            <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-prata">
                LA CORTE
            </h1>
            <p class="text-verde-corte font-semibold tracking-widest text-sm mt-1">SISTEMA GERENCIAL</p>
        </div>
        <div>
            <button onclick="fazerLogout()" class="text-prata hover:text-white text-sm uppercase tracking-wider transition-colors">
                Sair / Fechar Caixa
            </button>
        </div>
    </header>

    <!-- Menu de Abas -->
    <nav class="flex gap-4 mb-8 border-b border-gray-800 pb-2">
        <button onclick="mudarAba('aba-pdv')" id="btn-pdv" class="text-verde-corte font-bold uppercase tracking-wider border-b-2 border-verde-corte pb-2 px-2 transition-colors">Frente de Caixa</button>
        <button onclick="mudarAba('aba-servicos')" id="btn-servicos" class="text-prata hover:text-white font-bold uppercase tracking-wider border-b-2 border-transparent pb-2 px-2 transition-colors">Meus Serviços</button>
    </nav>

    <!-- ABA 1: FRENTE DE CAIXA -->
    <main id="aba-pdv" class="max-w-5xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-chumbo-claro p-6 rounded-lg border-l-4 border-verde-corte shadow-lg">
                <h2 class="text-prata text-sm uppercase tracking-wider mb-2">Faturamento (Hoje)</h2>
                <div class="flex items-center justify-between">
                    <span id="valor-faturamento" class="text-3xl font-bold text-gray-500">Carregando...</span>
                </div>
            </div>
            <div class="bg-chumbo-claro p-6 rounded-lg border-l-4 border-verde-corte shadow-lg">
                <h2 class="text-prata text-sm uppercase tracking-wider mb-2">Cortes Realizados (Hoje)</h2>
                <div class="flex items-center justify-between">
                    <span id="qtd-cortes" class="text-3xl font-bold text-gray-500">...</span>
                    <span id="qtd-agendados" class="text-prata font-bold">...</span>
                </div>
            </div>
        </div>

        <div class="bg-chumbo-claro p-6 rounded-lg border-t-4 border-verde-corte shadow-lg">
            <h2 class="text-prata font-bold uppercase tracking-wider mb-6 flex items-center gap-2">
                <span>+</span> Registrar Nova Venda
            </h2>
            <form id="form-pdv" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div class="md:col-span-2">
                    <label class="block text-prata text-xs uppercase mb-2">Serviço Realizado</label>
                    <select id="pdv-servico" class="w-full bg-chumbo border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-verde-corte" required>
                        <option value="" disabled selected>Selecione um serviço...</option>
                        <!-- Os serviços serão carregados do banco de dados aqui -->
                    </select>
                </div>
                <div>
                    <label class="block text-prata text-xs uppercase mb-2">Pagamento</label>
                    <select id="pdv-pagamento" class="w-full bg-chumbo border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-verde-corte" required>
                        <option value="pix">Pix</option>
                        <option value="cartao_credito">Cartão de Crédito</option>
                        <option value="cartao_debito">Cartão de Débito</option>
                        <option value="dinheiro">Dinheiro</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="w-full bg-verde-corte hover:bg-green-800 text-white font-bold py-3 px-4 rounded transition-colors uppercase tracking-widest text-sm">
                        Receber
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- ABA 2: GERENCIAR SERVIÇOS -->
    <main id="aba-servicos" class="max-w-5xl mx-auto hidden">
        <div class="bg-chumbo-claro p-6 rounded-lg border-t-4 border-verde-corte shadow-lg mb-8">
            <h2 class="text-prata font-bold uppercase tracking-wider mb-6">Cadastrar Novo Serviço</h2>
            <form id="form-novo-servico" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-prata text-xs uppercase mb-2">Nome do Serviço</label>
                    <input type="text" id="nome-servico" class="w-full bg-chumbo border border-gray-700 rounded p-3 text-white" required placeholder="Ex: Corte Clássico">
                </div>
                <div>
                    <label class="block text-prata text-xs uppercase mb-2">Preço (R$)</label>
                    <input type="number" step="0.01" id="preco-servico" class="w-full bg-chumbo border border-gray-700 rounded p-3 text-white" required placeholder="50.00">
                </div>
                <div>
                    <button type="submit" class="w-full bg-verde-corte hover:bg-green-800 text-white font-bold py-3 px-4 rounded uppercase tracking-widest text-sm">
                        Salvar Serviço
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabela de Serviços Cadastrados -->
        <div class="bg-chumbo-claro rounded-lg overflow-hidden shadow-lg border border-gray-800">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-chumbo text-prata text-xs uppercase tracking-wider border-b border-gray-800">
                        <th class="p-4">Serviço</th>
                        <th class="p-4">Preço</th>
                        <th class="p-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-servicos-tabela">
                    <tr><td colspan="3" class="p-4 text-center text-gray-500">Carregando serviços...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Função simples para alternar as abas
        function mudarAba(abaId) {
            document.getElementById('aba-pdv').classList.add('hidden');
            document.getElementById('aba-servicos').classList.add('hidden');
            
            document.getElementById('btn-pdv').classList.replace('text-verde-corte', 'text-prata');
            document.getElementById('btn-pdv').classList.replace('border-verde-corte', 'border-transparent');
            
            document.getElementById('btn-servicos').classList.replace('text-verde-corte', 'text-prata');
            document.getElementById('btn-servicos').classList.replace('border-verde-corte', 'border-transparent');

            // Ativa a selecionada
            document.getElementById(abaId).classList.remove('hidden');
            const btnAtivo = abaId === 'aba-pdv' ? 'btn-pdv' : 'btn-servicos';
            document.getElementById(btnAtivo).classList.replace('text-prata', 'text-verde-corte');
            document.getElementById(btnAtivo).classList.replace('border-transparent', 'border-verde-corte');
        }
    </script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/admin.js"></script>
</body>
</html>
