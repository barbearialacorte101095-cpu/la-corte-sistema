<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Corte Barber Shop - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'chumbo': '#121212',
                        'chumbo-claro': '#1E1E1E',
                        'verde-corte': '#1F4529',
                        'prata': '#B0B0B0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-chumbo text-white min-h-screen p-8 font-sans">

    <!-- Cabeçalho -->
    <header class="flex justify-between items-center border-b border-verde-corte pb-6 mb-8">
        <div>
            <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-prata">
                LA CORTE
            </h1>
            <p class="text-verde-corte font-semibold tracking-widest text-sm mt-1">BARBER SHOP</p>
        </div>
        <div class="text-prata text-sm">
            Painel Administrativo
        </div>
    </header>

    <!-- Grid de Cards Financeiros -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Card 1: Faturamento do Dia -->
        <div class="bg-chumbo-claro p-6 rounded-lg border-l-4 border-verde-corte shadow-lg">
            <h2 class="text-prata text-sm uppercase tracking-wider mb-2">Faturamento (Hoje)</h2>
            <div class="flex items-center justify-between">
                <span id="valor-faturamento" class="text-3xl font-bold text-gray-500">Carregando...</span>
            </div>
        </div>

        <!-- Card 2: Cortes Realizados -->
        <div class="bg-chumbo-claro p-6 rounded-lg border-l-4 border-verde-corte shadow-lg">
            <h2 class="text-prata text-sm uppercase tracking-wider mb-2">Cortes Realizados</h2>
            <div class="flex items-center justify-between">
                <span id="qtd-cortes" class="text-3xl font-bold text-gray-500">...</span>
                <span id="qtd-agendados" class="text-prata font-bold">...</span>
            </div>
        </div>

        <!-- Card 3: Comissões Pendentes -->
        <div class="bg-chumbo-claro p-6 rounded-lg border-l-4 border-red-900 shadow-lg">
            <h2 class="text-prata text-sm uppercase tracking-wider mb-2">Comissões (A Pagar)</h2>
            <div class="flex items-center justify-between">
                <span id="valor-comissoes" class="text-3xl font-bold text-gray-500">Carregando...</span>
            </div>
        </div>
    </main>

    <!-- Importando os scripts do sistema -->
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/admin.js"></script>
</body>
</html>
